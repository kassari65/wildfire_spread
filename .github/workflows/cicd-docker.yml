name: CI/CD and Docker

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Lay source code tu GitHub
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Chuan bi moi truong build Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Dang nhap Docker Hub (dung GitHub Secrets)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build Docker image va push len Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/wildfire-spread-ai:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/wildfire-spread-ai:${{ github.sha }}

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      # 5. Mo phong buoc deploy (nhu tai lieu huong dan trang 4)
      - name: Deploy Simulation
        run: |
          echo "Build and push Docker Image successfully!"
          echo "Docker image tag: ${{ secrets.DOCKERHUB_USERNAME }}/wildfire-spread-ai:latest"
          echo "Ready for deployment: docker run -d -p 7860:7860 ${{ secrets.DOCKERHUB_USERNAME }}/wildfire-spread-ai:latest"

